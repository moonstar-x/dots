time_format = "%-I:%M:%S %p"

[typst]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[username]
format = '\[[$user]($style)\]'

[vagrant]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[vcsh]
format = '\[vcsh [$symbol$repo]($style)\]'

[vlang]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[xmake]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[zig]
