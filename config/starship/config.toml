[shlvl]
format = '\[[$symbol$shlvl]($style)\]'
disabled = false
symbol = "󰹍 "

[custom.tmux]
when = '[ -n "$TMUX" ]'
command = "tmux display-message -p '#S'"
shell = ["sh"]
symbol = " "
style = "bold green"
format = '\[[$symbol$output]($style)\]'

[custom.npm]
detect_files = ["package-lock.json"]
symbol = " "
style = "bold red"
format = '\[[${symbol}npm]($style)\]'

[custom.pnpm]
detect_files = ["pnpm-lock.yaml"]
symbol = " "
style = "bold yellow"
format = '\[[${symbol}pnpm]($style)\]'

[custom.yarn]
detect_files = ["yarn.lock"]
symbol = " "
style = "bold blue"
format = '\[[${symbol}yarn]($style)\]'

