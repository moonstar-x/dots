"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username$hostname$localip$shlvl$directory\
$git_branch$git_commit$git_state$git_metrics$git_status\
$hg_branch$fossil_branch$fossil_metrics$pijul_channel$jj_bookmark$vcsh\
$line_break$sudo$jobs$character"""
right_format = "$all"
add_newline = true
command_timeout = 1000
continuation_prompt = "[∙](overlay0) "
palette = "catppuccin_macchiato"

[character]
success_symbol = "[[󰄛](green) ❯](peach)"
error_symbol = "[[󰄛](red) ❯](peach)"
vimcmd_symbol = "[󰄛 ❮](subtext1)"

[aws]
format = '\[[$symbol($profile)(\($region\))(\[$duration\])]($style)\]'
symbol = " "

[azure]
format = '\[[$symbol($subscription)]($style)\]'
symbol = " "

[battery]
disabled = true
format = '\[[$symbol$percentage]($style)\]'
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "

[buf]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[bun]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[c]
format = '\[[$symbol($version(-$name))]($style)\]'
symbol = " "

[cmake]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[cmd_duration]
format = '\[[⏱ $duration]($style)\]'
show_notifications = false

[cobol]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[conda]
format = '\[[$symbol$environment]($style)\]'
symbol = " "

[container]
format = '\[[$symbol \[$name\]]($style)\]'
symbol = " "

[cpp]
format = '\[[$symbol($version(-$name))]($style)\]'
symbol = " "

[crystal]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[daml]
format = '\[[$symbol($version)]($style)\]'

[dart]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[deno]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[directory]
style = "bold lavender"
read_only = " 󰌾"
truncation_length = 3
truncate_to_repo = false
truncation_symbol = "…/"
repo_root_style = "bold mauve"

[directory.substitutions]
"~/dots" = " ~/dots"

[direnv]
format = '\[[$symbol$loaded/$allowed]($style)\]'
symbol = " "

[docker_context]
format = '\[[$symbol$context]($style)\]'
symbol = " "

[dotnet]
format = '\[[$symbol($version)(🎯 $tfm)]($style)\]'
symbol = " "

[elixir]
format = '\[[$symbol($version \(OTP $otp_version\))]($style)\]'
symbol = " "

[elm]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[erlang]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[fennel]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[fortran]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[fossil_branch]
format = '\[[$symbol$branch]($style)\]'
symbol = " "

[fossil_metrics]
format = '\[[+$added]($added_style)\]\[[-$deleted]($deleted_style)\]'

[gcloud]
format = '\[[$symbol$account(@$domain)(\($region\))]($style)\]'
symbol = "󱇶 "

[git_branch]
format = '\[[$symbol$branch]($style)\]'
style = "bold mauve"
symbol = " "
truncation_length = 24
truncation_symbol = "…"

[git_commit]
format = '\[[\($hash$tag\)]($style)\]'
tag_symbol = '  '
tag_disabled = false

[git_metrics]
format = '(\[[+$added]($added_style)\])(\[[-$deleted]($deleted_style)\])'
disabled = false

[git_state]
format = '\[[$state ($progress_current/$progress_total)]($style)\]'

[git_status]
format = '([\[$all_status$ahead_behind\]]($style))'
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "=${count}"
stashed = '\$${count}'
deleted = "✘${count}"
renamed = "»${count}"
modified = "!${count}"
staged = "+${count}"
untracked = "?${count}"

[gleam]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[golang]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[gradle]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[guix_shell]
format = '\[[$symbol]($style)\]'
symbol = " "

[haskell]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[haxe]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[helm]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[hg_branch]
format = '\[[$symbol$branch]($style)\]'
symbol = " "

[hostname]
format = '\[[$ssh_symbol($hostname)]($style)\] '
ssh_symbol = " "

[java]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[jobs]
format = '\[[$symbol$number]($style)\]'

[julia]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[kotlin]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[kubernetes]
format = '\[[$symbol$context( \($namespace\))]($style)\]'
symbol = "󱃾 "

[localip]
format = '\[[$localipv4]($style)\]'

[lua]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[memory_usage]
format = '\[$symbol[$ram( | $swap)]($style)\]'
disabled = true
symbol = "󰍛 "

[meson]
format = '\[[$symbol$project]($style)\]'
symbol = "󰔷 "

[mise]
format = '\[[$symbol$health]($style)\]'

[mojo]
format = '\[[$symbol($version)]($style)\]'
symbol = "󰈸 "

[nats]
format = '\[[$symbol$name]($style)\]'
symbol = " "

[netns]
format = '\[[$symbol \[$name\]]($style)\]'
symbol = "󰛳 "

[nim]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[nix_shell]
format = '\[[$symbol$state( \($name\))]($style)\]'
symbol = " "

[nodejs]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[ocaml]
format = '\[[$symbol($version)(\($switch_indicator$switch_name\))]($style)\]'
symbol = " "

[odin]
format = '\[[$symbol($version )]($style)\]'
symbol = "󰟢 "

[opa]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[openstack]
format = '\[[$symbol$cloud(\($project\))]($style)\]'
symbol = " "

[os]
format = '\[[$symbol]($style)\]'

[package]
format = '\[[$symbol$version]($style)\]'
symbol = "󰏗 "

[perl]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[php]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[pijul_channel]
format = '\[[$symbol$channel]($style)\]'
symbol = " "

[pixi]
format = '\[[$symbol$version( $environment)]($style)\]'
symbol = "󰏗 "

[pulumi]
format = '\[[$symbol$stack]($style)\]'
symbol = " "

[purescript]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[python]
format = '\[[${symbol}${pyenv_prefix}(${version})(\($virtualenv\))]($style)\]'
symbol = " "
pyenv_version_name = true

[quarto]
format = '\[[$symbol($version)]($style)\]'

[raku]
format = '\[[$symbol($version-$vm_version)]($style)\]'
symbol = "󱖊 "

[red]
format = '\[[$symbol($version)]($style)\]'
symbol = "󱍼 "

[rlang]
format = '\[[$symbol($version)]($style)\]'
symbol = "󰟔 "

[ruby]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[rust]
format = '\[[$symbol($version)]($style)\]'
symbol = "󱘗 "

[scala]
format = '\[[$symbol($version)]($style)\]'
symbol = " "

[shell]
format = '\[[$indicator]($style)\]'

[singularity]
