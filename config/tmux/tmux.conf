# Ghostty starts tmux directly rather than through zsh, so the server misses what
# .zprofile/.zshrc set up. Popups, #() status commands and plugins all run with it.
if-shell 'case ":$PATH:" in *:/opt/homebrew/bin:*) exit 1;; esac' \
    'set-environment -g PATH "/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"'
run-shell '. ~/.zsh/fzf.sh && tmux set-environment -g FZF_DEFAULT_OPTS "$FZF_DEFAULT_OPTS"'

# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix                     # press twice to send C-Space to the app

# Terminal
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"      # true colour (Ghostty reports xterm-ghostty)
set -as terminal-features ",xterm*:usstyle"  # coloured undercurls for LSP diagnostics
set -as terminal-features ",xterm*:extkeys"  # outer terminal understands extended keys
set -s extended-keys on                      # pass C-Enter, S-Enter, etc. through to Neovim
set -s extended-keys-format csi-u
set -sg escape-time 10                       # no delay after <Esc> in Neovim
set -g focus-events on                       # lets Neovim reload files changed outside it
set -g set-clipboard on                      # yanks reach the macOS clipboard over OSC 52
set -g allow-passthrough on                  # image previews (superfile, Neovim) reach Ghostty

# Quality of life
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize on
set -g detach-on-destroy off                 # closing a session jumps to another one
setw -g monitor-activity on                  # highlight windows with new output in the bar
set -g visual-activity off
setw -g automatic-rename-format "#{b:pane_current_path}"  # windows are named after their directory
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear  # stay in place after a mouse yank

# New panes and windows open in the current directory.
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind x kill-pane

# Move the current window left/right in the bar.
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# Type into every pane of the window at once (shown as SYNC by prefix-highlight).
bind S setw synchronize-panes \; display "synchronize-panes #{?synchronize-panes,on,off}"

# Resize panes with <prefix> H/J/K/L, repeatable without pressing the prefix again.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Alt-1..9 jumps straight to a window (Ghostty sends left Option as Alt).
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# Popups
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit
bind D display-popup -E -w 90% -h 90% lazydocker
bind b display-popup -E -w 90% -h 90% btop
bind f display-popup -E -w 90% -h 90% -d "#{pane_current_path}" spf

# Fuzzy-pick a session to switch to.
bind s display-popup -E -w 40% -h 40% \
    "session=\$(tmux list-sessions -F '#S' | fzf --reverse --prompt 'session> ') && tmux switch-client -t \"\$session\""

# Fuzzy-pick a git repo and open (or switch to) a session named after it.
bind o display-popup -E -w 60% -h 50% '\
    dir=$(fd -H -t d -d 4 "^\.git$" ~/Desktop ~/Documents ~/dots | sed "s|/\.git/*$||" | fzf --reverse --prompt "project> ") || exit 0; \
    name=$(basename "$dir" | tr ".:" "__"); \
    tmux has-session -t "=$name" 2>/dev/null || tmux new-session -ds "$name" -c "$dir"; \
    tmux switch-client -t "=$name"'

# Floating scratch terminal that keeps running between toggles.
bind t if -F "#{==:#{session_name},scratch}" "detach-client" \
    'display-popup -E -w 80% -h 80% "tmux new-session -A -s scratch \\; set-option detach-on-destroy on"'

# Fuzzy-pick a URL from the current pane and open it in the browser.
bind u display-popup -E -w 60% -h 40% '\
    url=$(tmux capture-pane -Jp -S -500 | grep -oE "https?://[^][:space:]\"<>()]+" | sort -u | fzf --reverse --prompt "url> ") && open "$url"'

# vim-tmux-navigator
# Ctrl-h/j/k/l move between tmux panes and Neovim splits as if they were one grid.
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind -T copy-mode-vi 'C-h' select-pane -L
bind -T copy-mode-vi 'C-j' select-pane -D
bind -T copy-mode-vi 'C-k' select-pane -U
bind -T copy-mode-vi 'C-l' select-pane -R
bind -T copy-mode-vi 'C-\' select-pane -l

# Ctrl-l is taken for navigation, so <prefix> Ctrl-l clears the shell instead.
bind C-l send-keys 'C-l'

# Theme
set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=#1e2030,fg=#cad3f5"

# #{prefix_highlight} and #{battery_*} are filled in by the plugins loaded at the end.
set -g status-left-length 60
set -g status-left "#[bg=#c6a0f6,fg=#181926,bold] #S #[default]#{prefix_highlight} "

set -g status-right-length 140
set -g status-right "#[fg=#a6da95]#(git -C '#{pane_current_path}' branch --show-current 2>/dev/null | sed 's/^/ /')#[fg=#a5adcb] #{pane_current_command} #[fg=#8aadf4]#(tmux-mem-cpu-load -i 2 -g 0 -a 0 -m 2 | awk '{print \"󰍛 \" \$1 \"  󰻠 \" \$2}') #{battery_color_charge_fg}#{battery_icon} #{battery_percentage} #[bg=#363a4f,fg=#cad3f5] %a %d %b #[bg=#c6a0f6,fg=#181926,bold] %-I:%M %p "

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#8087a2] #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-current-format "#[bg=#363a4f,fg=#c6a0f6,bold] #I #[fg=#cad3f5]#W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-activity-style "fg=#f5a97f"
setw -g window-status-bell-style "fg=#ed8796,bold"

set -g pane-border-style "fg=#363a4f"
set -g pane-active-border-style "fg=#c6a0f6"
set -g pane-border-status top                # label each pane when a window is split
set -g pane-border-format "#{?pane_active,#[fg=#c6a0f6 bold],#[fg=#8087a2]} #{pane_index} #{pane_current_command} "
set -g popup-style "bg=default,fg=default"   # tmux 3.8 defaults popups to a grey background
set -g popup-border-style "fg=#c6a0f6"
set -g popup-border-lines rounded
set -g display-panes-colour "#8087a2"
set -g display-panes-active-colour "#c6a0f6"

set -g message-style "bg=#363a4f,fg=#cad3f5"
set -g message-command-style "bg=#363a4f,fg=#cad3f5"
setw -g mode-style "bg=#494d64,fg=#cad3f5"
setw -g clock-mode-colour "#c6a0f6"

# Replace tmux 3.8's built-in grey/yellow theme colours.
set -g menu-style "bg=#1e2030,fg=#cad3f5"
set -g menu-selected-style "bg=#c6a0f6,fg=#181926,bold"
set -g menu-border-style "bg=#1e2030,fg=#c6a0f6"
set -g menu-border-lines rounded
set -g display-panes-border-style "bg=#1e2030,fg=#494d64"
setw -g copy-mode-match-style "bg=#eed49f,fg=#181926"
setw -g copy-mode-current-match-style "bg=#f5a97f,fg=#181926,bold"
setw -g copy-mode-mark-style "bg=#c6a0f6,fg=#181926"
setw -g copy-mode-line-number-style "fg=#6e738d"
setw -g copy-mode-current-line-number-style "fg=#c6a0f6"
setw -g fill-character "#{?is_inside,#[bg=#1e2030] ,#[fg=#494d64]#[acs]~}"
setw -g pane-scrollbars-style "bg=#1e2030,fg=#494d64,width=1,pad=0"
setw -g tree-mode-border-style "bg=#1e2030,fg=#494d64"
setw -g tree-mode-preview-style "fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},##c6a0f6,##8aadf4}"

# Plugins
# tmux-menus:      <prefix> \ or <prefix> Enter
# tmux-fzf:        <prefix> F
# tmux-resurrect:  <prefix> C-s saves, <prefix> C-r restores
TMUX_PLUGIN_MANAGER_PATH="$HOME/.config/tmux/plugins"  # same variable TPM sets; tmux-menus uses it to find the others

set -g @resurrect-capture-pane-contents "on"
set -g @continuum-restore "on"               # restore the last save when the server starts

set -g @prefix_highlight_output_prefix " "
set -g @prefix_highlight_output_suffix " "
set -g @prefix_highlight_fg "#181926"
set -g @prefix_highlight_bg "#ed8796"
set -g @prefix_highlight_prefix_prompt "PREFIX"
set -g @prefix_highlight_show_copy_mode "on"
set -g @prefix_highlight_copy_mode_attr "fg=#181926,bg=#eed49f,bold"
set -g @prefix_highlight_copy_prompt "COPY"
set -g @prefix_highlight_show_sync_mode "on"
set -g @prefix_highlight_sync_mode_attr "fg=#181926,bg=#f5a97f,bold"
set -g @prefix_highlight_sync_prompt "SYNC"

set -g @batt_icon_charge_tier8 "󰁹"
set -g @batt_icon_charge_tier7 "󰂁"
set -g @batt_icon_charge_tier6 "󰂀"
set -g @batt_icon_charge_tier5 "󰁾"
set -g @batt_icon_charge_tier4 "󰁽"
set -g @batt_icon_charge_tier3 "󰁼"
set -g @batt_icon_charge_tier2 "󰁻"
set -g @batt_icon_charge_tier1 "󰂎"
set -g @batt_icon_status_charging "󰂄"
set -g @batt_icon_status_charged "󰂅"
set -g @batt_icon_status_attached "󰚥"
set -g @batt_icon_status_unknown "󰂑"
set -g @batt_color_charge_primary_tier8 "#a6da95"
set -g @batt_color_charge_primary_tier7 "#a6da95"
set -g @batt_color_charge_primary_tier6 "#a6da95"
set -g @batt_color_charge_primary_tier5 "#eed49f"
set -g @batt_color_charge_primary_tier4 "#eed49f"
set -g @batt_color_charge_primary_tier3 "#f5a97f"
set -g @batt_color_charge_primary_tier2 "#ed8796"
set -g @batt_color_charge_primary_tier1 "#ed8796"

run-shell "$TMUX_PLUGIN_MANAGER_PATH/tmux-sensible/sensible.tmux"   # only fills in options not set above
run-shell "$TMUX_PLUGIN_MANAGER_PATH/tmux-menus/menus.tmux"
run-shell "$TMUX_PLUGIN_MANAGER_PATH/tmux-fzf/main.tmux"
run-shell "$TMUX_PLUGIN_MANAGER_PATH/tmux-resurrect/resurrect.tmux"
run-shell "$TMUX_PLUGIN_MANAGER_PATH/tmux-battery/battery.tmux"
run-shell "$TMUX_PLUGIN_MANAGER_PATH/tmux-prefix-highlight/prefix_highlight.tmux"
run-shell "$TMUX_PLUGIN_MANAGER_PATH/tmux-continuum/continuum.tmux" # last: hooks its autosave into status-right
